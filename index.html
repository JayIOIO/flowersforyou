<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D ASCII Wildflower Bouquet</title>
    <style>
        /* Reset and full-screen dark charcoal-slate terminal canvas */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #1a1e26;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <canvas id="asciiCanvas"></canvas>

    <script>
        (function () {
            const canvas = document.getElementById('asciiCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            // Deterministic pseudo-random generator for consistent bouquet architecture
            let seed = 8842;
            function rand() {
                seed = (seed * 1664525 + 1013904223) % 4294967296;
                return seed / 4294967296;
            }
            function randRange(min, max) {
                return min + rand() * (max - min);
            }

            // Grid & Z-Buffer state
            let cols = 0;
            let rows = 0;
            let cellW = 7;
            let cellH = 12;
            let zBuffer = new Float32Array(0);
            let charBuffer = [];
            let colorBuffer = [];
            let glowBuffer = new Uint8Array(0);

            // Color palettes matching the terminal wildflower aesthetic
            const STEM_PALETTE = [
                '#6f947c', '#7fa68a', '#8eb899', '#5d806a', '#9fc4a8', '#a8cfb2'
            ];

            const FLOWER_THEMES = [
                { name: 'coral',      inner: ['#ffd166', '#ffb703', '#ffffff'], outer: ['#ff6b81', '#ff758f', '#ff8fa3'], accent: '#ffc2d1' },
                { name: 'amber',      inner: ['#ffffff', '#fff3b0', '#ff9f1c'], outer: ['#feca57', '#ffbe0b', '#ffd166'], accent: '#ffeaa7' },
                { name: 'periwinkle', inner: ['#ffffff', '#fef08a', '#bae6fd'], outer: ['#54a0ff', '#60a5fa', '#3b82f6'], accent: '#bfdbfe' },
                { name: 'lavender',   inner: ['#fef08a', '#ffffff', '#f5d0fe'], outer: ['#a29bfe', '#c084fc', '#b794f4'], accent: '#e9d5ff' },
                { name: 'cream',      inner: ['#feca57', '#ff9f43', '#ff6b81'], outer: ['#f5f6fa', '#e2e8f0', '#fef9c3'], accent: '#ffffff' }
            ];

            // 3D point cloud structures for stems, foliage, and flower heads
            const bouquetPoints = [];
            const ambientParticles = [];

            // Flower arrangement cycling state (0: Wildflowers, 1: Sunflowers, 2: Tulips, 3: Mixed Garden)
            const FLOWER_MODES = ['wildflowers', 'sunflowers', 'tulips', 'mixed'];
            const MODE_QUOTES = [
                'you are my forever soulmate',
                'you are my sunshine in every season',
                'blooming endlessly just for you',
                'a handpicked garden made to last forever'
            ];
            let currentModeIndex = 0;
            let transitionProgress = 1; // 0 -> 1 smooth bloom/morph transition on click
            let lastTime = 0;
            let spinAngle = 0;
            let lastSwitchTimestamp = 0;

            /**
             * Helper: Oriented 3D local transform for flower heads
             */
            function createTransform(fx, fy, fz, tiltX, tiltZ) {
                const cosTX = Math.cos(tiltX), sinTX = Math.sin(tiltX);
                const cosTZ = Math.cos(tiltZ), sinTZ = Math.sin(tiltZ);
                return function (lx, ly, lz) {
                    const x1 = lx * cosTZ - ly * sinTZ;
                    const y1 = lx * sinTZ + ly * cosTZ;
                    const z1 = lz;

                    const y2 = y1 * cosTX - z1 * sinTX;
                    const z2 = y1 * sinTX + z1 * cosTX;
                    return {
                        x: fx + x1,
                        y: fy + y2,
                        z: fz + z2
                    };
                };
            }

            /**
             * Helper: Adds a multi-layered wildflower bloom at (fx, fy, fz)
             */
            function addWildflowerHead(fx, fy, fz, theme, scale, tiltX, tiltZ) {
                const bloomRadius = 0.135 * scale;
                const transformLocal = createTransform(fx, fy, fz, tiltX, tiltZ);

                const coreChars = ['@', '0', 'O', 'o', '*', '+'];
                for (let c = 0; c < 18; c++) {
                    const r = Math.sqrt(rand()) * bloomRadius * 0.34;
                    const a = rand() * Math.PI * 2;
                    const h = (1 - r / (bloomRadius * 0.36)) * 0.035;
                    const pos = transformLocal(Math.cos(a) * r, h, Math.sin(a) * r);
                    bouquetPoints.push({
                        x: pos.x,
                        y: pos.y,
                        z: pos.z,
                        color: theme.inner[c % theme.inner.length],
                        type: 'core',
                        customChar: coreChars[c % coreChars.length],
                        phase: rand() * Math.PI * 2,
                        glow: 0.9
                    });
                }

                const petalCount = Math.floor(randRange(5, 8));
                const petalChars = ['o', 'O', '0', '#', '*', '+', '=', ':'];
                for (let p = 0; p < petalCount; p++) {
                    const baseAngle = (p / petalCount) * Math.PI * 2 + randRange(-0.15, 0.15);
                    const pLen = bloomRadius * randRange(0.88, 1.18);
                    const pWidth = bloomRadius * randRange(0.45, 0.65);
                    const cupLift = randRange(0.01, 0.055);

                    const radialSteps = 6;
                    const angularSteps = 5;
                    for (let rs = 1; rs <= radialSteps; rs++) {
                        const rf = rs / radialSteps;
                        const envelope = Math.sin(rf * Math.PI * 0.88);
                        for (let as = -angularSteps; as <= angularSteps; as++) {
                            const af = as / angularSteps;
                            if (Math.abs(af) > envelope + 0.15) continue;

                            const localDist = rf * pLen;
                            const spreadAngle = baseAngle + af * (pWidth / Math.max(0.04, pLen));
                            const lx = Math.cos(spreadAngle) * localDist;
                            const lz = Math.sin(spreadAngle) * localDist;
                            const ly = Math.pow(rf, 1.5) * cupLift - Math.abs(af) * 0.012;

                            const pos = transformLocal(lx, ly, lz);
                            const isEdge = rf > 0.82 || Math.abs(af) > envelope * 0.85;
                            const colorPool = isEdge ? theme.outer : [theme.accent, ...theme.outer];
                            const col = colorPool[(rs + Math.abs(as) + p) % colorPool.length];
                            const ch = isEdge
                                ? (rf > 0.9 ? '.' : 'o')
                                : petalChars[(rs * 3 + Math.abs(as)) % petalChars.length];

                            bouquetPoints.push({
                                x: pos.x,
                                y: pos.y,
                                z: pos.z,
                                color: col,
                                type: 'petal',
                                customChar: ch,
                                phase: rand() * Math.PI * 2,
                                glow: isEdge ? 0.55 : 0.78
                            });
                        }
                    }
                }
            }

            /**
             * Helper: Adds a prominent 3D ASCII Sunflower head at (fx, fy, fz)
             * Wide circular dark-brown and burnt-amber phyllotaxis seed center + 18 radiating golden petals
             */
            function addSunflowerHead(fx, fy, fz, scale, tiltX, tiltZ) {
                const transformLocal = createTransform(fx, fy, fz, tiltX, tiltZ);
                const discRadius = 0.145 * scale;
                const petalOuterRadius = 0.305 * scale;

                // 1. Dense Phyllotaxis seed disc (@, #, 0, *) in deep espresso brown & burnt amber
                const discColors = ['#3b2314', '#5c3317', '#78350f', '#92400e', '#451a03', '#b45309'];
                const discChars = ['@', '#', '0', '*', 'O', '+'];
                const seedCount = 105;
                for (let s = 0; s < seedCount; s++) {
                    const frac = s / seedCount;
                    const r = Math.sqrt(frac) * discRadius;
                    const angle = s * 2.39996323; // Golden angle spiral
                    const domeY = Math.cos(frac * Math.PI * 0.5) * 0.034 * scale;
                    const pos = transformLocal(Math.cos(angle) * r, domeY, Math.sin(angle) * r);

                    const isRim = frac > 0.82;
                    const col = isRim ? '#d97706' : discColors[s % discColors.length];
                    const ch = isRim ? '0' : discChars[s % discChars.length];

                    bouquetPoints.push({
                        x: pos.x,
                        y: pos.y,
                        z: pos.z,
                        color: col,
                        type: 'core',
                        customChar: ch,
                        phase: rand() * Math.PI * 2,
                        glow: isRim ? 0.78 : 0.38
                    });
                }

                // 2. 18 pointed radiating golden-yellow sunflower petals
                const rayCount = 18;
                const petalColors = ['#ffd166', '#ffb703', '#fca311', '#ffe066', '#f59e0b', '#fff3b0'];
                const rayChars = ['O', '0', 'o', '+', '*'];
                for (let p = 0; p < rayCount; p++) {
                    const angle = (p / rayCount) * Math.PI * 2 + (p % 2) * 0.045;
                    const layerOffset = (p % 2 === 0) ? 0.008 : -0.006;
                    const pLen = petalOuterRadius * randRange(0.95, 1.07);
                    const pHalfWidth = 0.032 * scale;

                    for (let rs = 1; rs <= 7; rs++) {
                        const rf = rs / 7;
                        const dist = discRadius * 0.86 + rf * (pLen - discRadius * 0.86);
                        const widthEnv = Math.sin(rf * Math.PI) * (1 - rf * 0.35);
                        const wSteps = rf > 0.85 ? 0 : 1;

                        for (let ws = -wSteps; ws <= wSteps; ws++) {
                            const perp = ws * pHalfWidth * widthEnv;
                            const lx = Math.cos(angle) * dist - Math.sin(angle) * perp;
                            const lz = Math.sin(angle) * dist + Math.cos(angle) * perp;
                            const ly = layerOffset - Math.pow(rf, 1.8) * 0.022;

                            const pos = transformLocal(lx, ly, lz);
                            const isTip = rf > 0.84;
                            const col = isTip ? '#fff3b0' : petalColors[(p + rs + Math.abs(ws)) % petalColors.length];
                            const ch = isTip ? (rf > 0.94 ? '*' : 'o') : rayChars[(rs + p) % rayChars.length];

                            bouquetPoints.push({
                                x: pos.x,
                                y: pos.y,
                                z: pos.z,
                                color: col,
                                type: 'petal',
                                customChar: ch,
                                phase: rand() * Math.PI * 2,
                                glow: isTip ? 0.85 : 0.72
                            });
                        }
                    }
                }
            }

            /**
             * Helper: Adds a 3D cup/goblet-shaped ASCII Tulip bloom at (fx, fy, fz)
             * Rounded base tapering slightly with three distinct scalloped top tips
             */
            function addTulipHead(fx, fy, fz, palette, scale, tiltX, tiltZ) {
                const transformLocal = createTransform(fx, fy, fz, tiltX, tiltZ);
                const cupHeight = 0.26 * scale;
                const cupRadius = 0.118 * scale;

                // Inner golden stamen core inside the tulip goblet
                for (let c = 0; c < 12; c++) {
                    const a = (c / 12) * Math.PI * 2;
                    const r = 0.025 * scale;
                    const pos = transformLocal(Math.cos(a) * r, 0.07 * scale, Math.sin(a) * r);
                    bouquetPoints.push({
                        x: pos.x,
                        y: pos.y,
                        z: pos.z,
                        color: '#ffd32a',
                        type: 'core',
                        customChar: c % 2 === 0 ? '*' : '|',
                        phase: rand() * Math.PI * 2,
                        glow: 0.85
                    });
                }

                // 6 overlapping cupped tulip tepals (3 prominent outer scalloped tips + 3 inner tepals)
                const petalChars = ['(', ')', '0', 'O', 'o', '#', ':', '*'];
                for (let p = 0; p < 6; p++) {
                    const isOuter = p < 3;
                    const baseAngle = ((p % 3) / 3) * Math.PI * 2 + (isOuter ? 0 : Math.PI / 3);
                    const rScale = isOuter ? 1.05 : 0.88;
                    const hScale = isOuter ? 1.02 : 0.95;

                    const hSteps = 10;
                    const wSteps = 4;
                    for (let hs = 0; hs <= hSteps; hs++) {
                        const v = hs / hSteps; // 0 at rounded base -> 1 at scalloped tip
                        // Goblet profile: rounded belly at v=0.35, tapering gently inward near top
                        const profileR = cupRadius * rScale * (0.28 + Math.sin(v * Math.PI * 0.78) * 0.86);
                        const angularSpan = (0.62 - v * 0.22) * (isOuter ? 1.08 : 0.92);

                        for (let ws = -wSteps; ws <= wSteps; ws++) {
                            const wf = ws / wSteps;
                            // Pointed scalloped top tip silhouette
                            if (v > 0.70 && Math.abs(wf) > (1.06 - v) * 3.1) continue;

                            const theta = baseAngle + wf * angularSpan;
                            const r = profileR * (1 - Math.abs(wf) * 0.12);
                            const lx = Math.cos(theta) * r;
                            const lz = Math.sin(theta) * r;
                            const ly = v * cupHeight * hScale;

                            const pos = transformLocal(lx, ly, lz);
                            const isRim = v > 0.84 || Math.abs(wf) === 1;
                            const col = isRim
                                ? palette.rim
                                : palette.body[(hs + Math.abs(ws) + p) % palette.body.length];
                            const ch = isRim
                                ? (v > 0.90 ? '^' : 'o')
                                : (Math.abs(wf) === 1 ? (wf < 0 ? '(' : ')') : petalChars[(hs + p) % petalChars.length]);

                            bouquetPoints.push({
                                x: pos.x,
                                y: pos.y,
                                z: pos.z,
                                color: col,
                                type: 'petal',
                                customChar: ch,
                                phase: rand() * Math.PI * 2,
                                glow: isRim ? 0.82 : 0.66
                            });
                        }
                    }
                }
            }

            /**
             * Helper: Adds a layered spiral 3D ASCII Rose bloom at (fx, fy, fz)
             */
            function addRoseHead(fx, fy, fz, palette, scale, tiltX, tiltZ) {
                const transformLocal = createTransform(fx, fy, fz, tiltX, tiltZ);
                const maxR = 0.155 * scale;
                const turns = 3.6;
                const steps = 110;
                const roseChars = ['@', '0', 'O', 'o', '(', ')', '#', '*'];

                for (let i = 0; i < steps; i++) {
                    const frac = i / steps;
                    const angle = frac * turns * Math.PI * 2;
                    const r = (0.08 + frac * 0.92) * maxR;
                    const cupY = (1 - frac * 0.55) * 0.065 * scale + Math.sin(angle * 3) * 0.012;

                    for (let layer = 0; layer < 2; layer++) {
                        const ly = cupY - layer * 0.018 * scale;
                        const pos = transformLocal(Math.cos(angle) * r, ly, Math.sin(angle) * r);
                        const col = frac < 0.3
                            ? palette.core
                            : palette.body[(i + layer) % palette.body.length];
                        const ch = roseChars[(i + layer * 2) % roseChars.length];

                        bouquetPoints.push({
                            x: pos.x,
                            y: pos.y,
                            z: pos.z,
                            color: col,
                            type: frac < 0.25 ? 'core' : 'petal',
                            customChar: ch,
                            phase: rand() * Math.PI * 2,
                            glow: frac > 0.75 ? 0.85 : 0.65
                        });
                    }
                }
            }

            /**
             * Builds the 3D bouquet structure for the selected flower mode:
             * - Mode 0 ('wildflowers'): 26 multi-layered wildflower heads + converging cone stems
             * - Mode 1 ('sunflowers'): 9 large 3D sunflowers with wide phyllotaxis centers & broad leaves
             * - Mode 2 ('tulips'): 14 cup-shaped tulips in crimson/pink, orange, yellow & royal violet + upright leaves
             * - Mode 3 ('mixed'): Spiral 3D roses, sunflowers, tulips, and delicate wildflowers
             */
            function buildBouquetGeometry(mode = 'wildflowers') {
                bouquetPoints.length = 0;
                seed = 8842 + currentModeIndex * 1337;

                const baseTip = { x: 0, y: -1.06, z: 0 };

                if (mode === 'wildflowers') {
                    const numFlowers = 26;
                    const flowers = [];

                    for (let i = 0; i < numFlowers; i++) {
                        const t = i / (numFlowers - 1);
                        const goldenAngle = i * 2.39996323;
                        const radialSpread = 0.16 + Math.pow(t, 0.72) * 0.86 + randRange(-0.06, 0.06);
                        const heightY = 0.94 - Math.pow(t, 1.15) * 0.80 + randRange(-0.08, 0.08);

                        const fx = Math.cos(goldenAngle) * radialSpread;
                        const fz = Math.sin(goldenAngle) * radialSpread;
                        const fy = heightY;

                        const theme = FLOWER_THEMES[i % FLOWER_THEMES.length];
                        const scale = randRange(0.75, 1.28);
                        const tiltX = Math.atan2(fz, fy + 1.1) * 0.65 + randRange(-0.2, 0.2);
                        const tiltZ = -Math.atan2(fx, fy + 1.1) * 0.65 + randRange(-0.2, 0.2);

                        flowers.push({ fx, fy, fz, theme, scale, tiltX, tiltZ });
                    }

                    flowers.forEach((fl, idx) => {
                        const strandCount = idx % 2 === 0 ? 3 : 2;
                        for (let s = 0; s < strandCount; s++) {
                            const offsetAngle = (s / strandCount) * Math.PI * 2 + idx;
                            const spreadFactor = s === 0 ? 0 : randRange(0.015, 0.045);
                            const endX = fl.fx + Math.cos(offsetAngle) * spreadFactor;
                            const endZ = fl.fz + Math.sin(offsetAngle) * spreadFactor;
                            const endY = fl.fy - 0.03;

                            const ctrlX = endX * 0.42 + Math.cos(offsetAngle) * 0.04;
                            const ctrlZ = endZ * 0.42 + Math.sin(offsetAngle) * 0.04;
                            const ctrlY = -0.35 + randRange(-0.08, 0.08);

                            const steps = 68;
                            for (let st = 0; st <= steps; st++) {
                                const u = st / steps;
                                const inv = 1 - u;
                                const px = inv * inv * baseTip.x + 2 * inv * u * ctrlX + u * u * endX;
                                const py = inv * inv * baseTip.y + 2 * inv * u * ctrlY + u * u * endY;
                                const pz = inv * inv * baseTip.z + 2 * inv * u * ctrlZ + u * u * endZ;

                                const color = STEM_PALETTE[(st + idx + s) % STEM_PALETTE.length];
                                const charType = (u < 0.28 && st % 3 === 0) ? 'wrap' : 'stem';

                                bouquetPoints.push({
                                    x: px,
                                    y: py,
                                    z: pz,
                                    color: color,
                                    type: charType,
                                    phase: rand() * Math.PI * 2,
                                    glow: u < 0.15 ? 0.3 : 0.15
                                });
                            }
                        }

                        addWildflowerHead(fl.fx, fl.fy, fl.fz, fl.theme, fl.scale, fl.tiltX, fl.tiltZ);
                    });

                    // Filler foliage & baby's-breath specks
                    for (let f = 0; f < 34; f++) {
                        const angle = (f / 34) * Math.PI * 2 + randRange(-0.2, 0.2);
                        const rad = randRange(0.25, 0.98);
                        const topY = randRange(-0.15, 0.86);
                        const tx = Math.cos(angle) * rad;
                        const tz = Math.sin(angle) * rad;

                        const steps = 42;
                        for (let st = 0; st <= steps; st++) {
                            const u = st / steps;
                            const px = tx * Math.pow(u, 0.92);
                            const pz = tz * Math.pow(u, 0.92);
                            const py = -1.06 + (topY + 1.06) * u;

                            bouquetPoints.push({
                                x: px,
                                y: py,
                                z: pz,
                                color: STEM_PALETTE[(f + st) % STEM_PALETTE.length],
                                type: 'stem',
                                phase: rand() * Math.PI * 2,
                                glow: 0.1
                            });

                            if (u > 0.45 && st % 5 === 0) {
                                const side = (st % 10 === 0) ? 1 : -1;
                                bouquetPoints.push({
                                    x: px - Math.sin(angle) * 0.045 * side,
                                    y: py + 0.015,
                                    z: pz + Math.cos(angle) * 0.045 * side,
                                    color: '#8eb899',
                                    type: 'leaf',
                                    customChar: side > 0 ? '/' : '\\',
                                    phase: rand() * Math.PI * 2,
                                    glow: 0.25
                                });
                            }
                        }

                        if (f % 2 === 0) {
                            for (let b = 0; b < 4; b++) {
                                bouquetPoints.push({
                                    x: tx + randRange(-0.04, 0.04),
                                    y: topY + randRange(-0.03, 0.04),
                                    z: tz + randRange(-0.04, 0.04),
                                    color: b % 2 === 0 ? '#f5f6fa' : '#feca57',
                                    type: 'speck',
                                    customChar: b === 0 ? 'o' : '.',
                                    phase: rand() * Math.PI * 2,
                                    glow: 0.65
                                });
                            }
                        }
                    }
                } else if (mode === 'sunflowers') {
                    const numSunflowers = 9;
                    for (let i = 0; i < numSunflowers; i++) {
                        const isCrown = i === 0;
                        const t = isCrown ? 0 : (i - 1) / (numSunflowers - 2);
                        const angle = i * 2.39996323;
                        const radialSpread = isCrown ? 0.05 : (0.30 + t * 0.56 + randRange(-0.04, 0.04));
                        const fy = isCrown ? 0.90 : (0.76 - t * 0.54 + randRange(-0.05, 0.05));
                        const fx = Math.cos(angle) * radialSpread;
                        const fz = Math.sin(angle) * radialSpread;
                        const scale = isCrown ? 1.28 : randRange(0.98, 1.20);

                        const tiltX = Math.atan2(fz, fy + 1.1) * 0.85 + 0.25;
                        const tiltZ = -Math.atan2(fx, fy + 1.1) * 0.85;

                        // Sturdy thick multi-strand sunflower stem
                        for (let s = 0; s < 4; s++) {
                            const sa = (s / 4) * Math.PI * 2;
                            const off = 0.016;
                            const endX = fx + Math.cos(sa) * off;
                            const endZ = fz + Math.sin(sa) * off;
                            const ctrlX = endX * 0.35;
                            const ctrlZ = endZ * 0.35;
                            const ctrlY = -0.35;

                            const steps = 72;
                            for (let st = 0; st <= steps; st++) {
                                const u = st / steps;
                                const inv = 1 - u;
                                const px = inv * inv * baseTip.x + 2 * inv * u * ctrlX + u * u * endX;
                                const py = inv * inv * baseTip.y + 2 * inv * u * ctrlY + u * u * (fy - 0.04);
                                const pz = inv * inv * baseTip.z + 2 * inv * u * ctrlZ + u * u * endZ;

                                bouquetPoints.push({
                                    x: px,
                                    y: py,
                                    z: pz,
                                    color: STEM_PALETTE[(st + i + s) % STEM_PALETTE.length],
                                    type: (u < 0.25 && st % 3 === 0) ? 'wrap' : 'stem',
                                    phase: rand() * Math.PI * 2,
                                    glow: 0.18
                                });

                                // Broad heart/oval sunflower leaves along mid-stem
                                if (s === 0 && (st === 28 || st === 46)) {
                                    const leafSide = st === 28 ? 1 : -1;
                                    const lDirX = Math.cos(angle + leafSide * 1.1);
                                    const lDirZ = Math.sin(angle + leafSide * 1.1);
                                    for (let lr = 1; lr <= 6; lr++) {
                                        const lf = lr / 6;
                                        const span = Math.sin(lf * Math.PI) * 0.082;
                                        for (let lw = -2; lw <= 2; lw++) {
                                            const wf = lw / 2;
                                            bouquetPoints.push({
                                                x: px + lDirX * lf * 0.23 - lDirZ * wf * span,
                                                y: py + Math.sin(lf * Math.PI * 0.8) * 0.048 - lf * 0.03,
                                                z: pz + lDirZ * lf * 0.23 + lDirX * wf * span,
                                                color: lr > 4 ? '#9fc4a8' : '#6f947c',
                                                type: 'leaf',
                                                customChar: Math.abs(wf) === 1 ? '~' : '#',
                                                phase: rand() * Math.PI * 2,
                                                glow: 0.25
                                            });
                                        }
                                    }
                                }
                            }
                        }

                        addSunflowerHead(fx, fy, fz, scale, tiltX, tiltZ);
                    }
                } else if (mode === 'tulips') {
                    const tulipPalettes = [
                        { body: ['#ff4d6d', '#ff758f', '#c9184a', '#ff8fa3'], rim: '#fff0f3' }, // Crimson / Pink
                        { body: ['#ff9f43', '#ff7b00', '#ffaa00', '#ff6b35'], rim: '#fff3b0' }, // Sunset Orange
                        { body: ['#ffd32a', '#ffdd00', '#ffea00', '#ffb700'], rim: '#fffffc' }, // Sunshine Yellow
                        { body: ['#9b59b6', '#c77dff', '#8e44ad', '#e0aaff'], rim: '#f3d5ff' }  // Royal Violet
                    ];

                    const numTulips = 14;
                    for (let i = 0; i < numTulips; i++) {
                        const t = i / (numTulips - 1);
                        const angle = i * 2.39996323;
                        const radialSpread = 0.12 + Math.pow(t, 0.78) * 0.68 + randRange(-0.04, 0.04);
                        const fy = 0.86 - Math.pow(t, 1.1) * 0.66 + randRange(-0.05, 0.05);
                        const fx = Math.cos(angle) * radialSpread;
                        const fz = Math.sin(angle) * radialSpread;
                        const palette = tulipPalettes[i % tulipPalettes.length];
                        const scale = randRange(0.94, 1.20);

                        const tiltX = Math.atan2(fz, fy + 1.2) * 0.55;
                        const tiltZ = -Math.atan2(fx, fy + 1.2) * 0.55;

                        // Tall slender green tulip stems
                        for (let s = 0; s < 2; s++) {
                            const off = s === 0 ? 0 : 0.012;
                            const endX = fx + Math.cos(angle + s) * off;
                            const endZ = fz + Math.sin(angle + s) * off;
                            const ctrlX = endX * 0.32;
                            const ctrlZ = endZ * 0.32;
                            const ctrlY = -0.32;

                            const steps = 68;
                            for (let st = 0; st <= steps; st++) {
                                const u = st / steps;
                                const inv = 1 - u;
                                const px = inv * inv * baseTip.x + 2 * inv * u * ctrlX + u * u * endX;
                                const py = inv * inv * baseTip.y + 2 * inv * u * ctrlY + u * u * fy;
                                const pz = inv * inv * baseTip.z + 2 * inv * u * ctrlZ + u * u * endZ;

                                bouquetPoints.push({
                                    x: px,
                                    y: py,
                                    z: pz,
                                    color: STEM_PALETTE[(st + i) % STEM_PALETTE.length],
                                    type: (u < 0.25 && st % 3 === 0) ? 'wrap' : 'stem',
                                    phase: rand() * Math.PI * 2,
                                    glow: 0.16
                                });
                            }
                        }

                        addTulipHead(fx, fy, fz, palette, scale, tiltX, tiltZ);
                    }

                    // Long upright blade-like tulip leaves
                    const leafCount = 12;
                    for (let l = 0; l < leafCount; l++) {
                        const la = (l / leafCount) * Math.PI * 2 + 0.2;
                        const leafHeight = randRange(0.28, 0.74);
                        const archOut = randRange(0.50, 0.86);
                        const steps = 46;

                        for (let st = 0; st <= steps; st++) {
                            const u = st / steps;
                            const widthEnv = Math.sin(u * Math.PI * 0.92);
                            const r = Math.pow(u, 1.35) * archOut;
                            const py = -1.02 + (leafHeight + 1.02) * Math.sin(u * Math.PI * 0.56);
                            const cx = Math.cos(la) * r;
                            const cz = Math.sin(la) * r;

                            const perpX = -Math.sin(la);
                            const perpZ = Math.cos(la);
                            const halfW = widthEnv * 0.055;

                            for (let w = -1; w <= 1; w++) {
                                bouquetPoints.push({
                                    x: cx + perpX * w * halfW,
                                    y: py,
                                    z: cz + perpZ * w * halfW,
                                    color: u > 0.7 ? '#a8cfb2' : '#7fa68a',
                                    type: 'leaf',
                                    customChar: w === 0 ? '|' : (w < 0 ? '(' : ')'),
                                    phase: rand() * Math.PI * 2,
                                    glow: 0.24
                                });
                            }
                        }
                    }
                } else {
                    // Mode 3 ('mixed'): Spiral 3D roses, sunflowers, tulips, and delicate wildflowers
                    const numBlooms = 18;
                    const rosePalettes = [
                        { core: '#fff0f3', body: ['#ff4d6d', '#ff758f', '#ff8fa3', '#c9184a'] },
                        { core: '#fff8e7', body: ['#ffb703', '#fb8500', '#ffd166', '#f77f00'] },
                        { core: '#f3e8ff', body: ['#c084fc', '#a855f7', '#e879f9', '#9333ea'] }
                    ];
                    const tulipPal = { body: ['#ff4d6d', '#ff99ac', '#ff758f', '#ffe5ec'], rim: '#ffffff' };

                    for (let i = 0; i < numBlooms; i++) {
                        const t = i / (numBlooms - 1);
                        const angle = i * 2.39996323;
                        const radialSpread = 0.14 + Math.pow(t, 0.76) * 0.78;
                        const fy = 0.90 - Math.pow(t, 1.12) * 0.73 + randRange(-0.05, 0.05);
                        const fx = Math.cos(angle) * radialSpread;
                        const fz = Math.sin(angle) * radialSpread;
                        const tiltX = Math.atan2(fz, fy + 1.1) * 0.68;
                        const tiltZ = -Math.atan2(fx, fy + 1.1) * 0.68;

                        for (let s = 0; s < 2; s++) {
                            const off = s * 0.015;
                            const endX = fx + Math.cos(angle + s) * off;
                            const endZ = fz + Math.sin(angle + s) * off;
                            const ctrlX = endX * 0.38;
                            const ctrlZ = endZ * 0.38;
                            const ctrlY = -0.34;
                            const steps = 66;
                            for (let st = 0; st <= steps; st++) {
                                const u = st / steps;
                                const inv = 1 - u;
                                bouquetPoints.push({
                                    x: inv * inv * baseTip.x + 2 * inv * u * ctrlX + u * u * endX,
                                    y: inv * inv * baseTip.y + 2 * inv * u * ctrlY + u * u * (fy - 0.03),
                                    z: inv * inv * baseTip.z + 2 * inv * u * ctrlZ + u * u * endZ,
                                    color: STEM_PALETTE[(st + i) % STEM_PALETTE.length],
                                    type: (u < 0.25 && st % 3 === 0) ? 'wrap' : 'stem',
                                    phase: rand() * Math.PI * 2,
                                    glow: 0.16
                                });
                            }
                        }

                        const kind = i % 4;
                        if (kind === 0) {
                            addSunflowerHead(fx, fy, fz, 0.92, tiltX, tiltZ);
                        } else if (kind === 1) {
                            addTulipHead(fx, fy, fz, tulipPal, 1.02, tiltX, tiltZ);
                        } else if (kind === 2) {
                            addRoseHead(fx, fy, fz, rosePalettes[i % rosePalettes.length], 1.05, tiltX, tiltZ);
                        } else {
                            addWildflowerHead(fx, fy, fz, FLOWER_THEMES[(i + 2) % FLOWER_THEMES.length], 1.15, tiltX, tiltZ);
                        }
                    }
                }
            }

            // Debounced click/tap handler to cycle through the 4 flower arrangements
            function cycleFlowerVariety(e) {
                if (e && e.cancelable) e.preventDefault();
                const now = performance.now();
                if (now - lastSwitchTimestamp < 220) return;
                lastSwitchTimestamp = now;

                currentModeIndex = (currentModeIndex + 1) % FLOWER_MODES.length;
                transitionProgress = 0;
                buildBouquetGeometry(FLOWER_MODES[currentModeIndex]);
            }

            /**
             * Builds floating background ASCII particles:
             * - Drifting ASCII star sparkles (., +, *, o)
             * - Tiny fluttering ASCII butterflies: (v) / \v/ alternating wing frames
             */
            function buildAmbientParticles() {
                ambientParticles.length = 0;

                for (let i = 0; i < 95; i++) {
                    const kinds = ['dot', 'dot', 'ring', 'plus', 'sparkleCluster'];
                    const kind = kinds[Math.floor(rand() * kinds.length)];
                    const colors = [
                        '#94a3b8', '#cbd5e1', '#feca57', '#ff6b81',
                        '#54a0ff', '#a29bfe', '#8eb899', '#f5f6fa'
                    ];
                    ambientParticles.push({
                        nx: rand(),
                        ny: rand(),
                        vx: randRange(-0.008, 0.008),
                        vy: randRange(-0.014, -0.003),
                        kind: kind,
                        color: colors[Math.floor(rand() * colors.length)],
                        phase: rand() * Math.PI * 2,
                        speed: randRange(1.2, 3.0)
                    });
                }

                // Floating ASCII butterflies with alternating `(v)` / `\v/` wing frames
                for (let b = 0; b < 6; b++) {
                    ambientParticles.push({
                        nx: randRange(0.08, 0.92),
                        ny: randRange(0.08, 0.86),
                        vx: randRange(-0.012, 0.012),
                        vy: randRange(-0.01, 0.006),
                        kind: 'butterfly',
                        color: b % 2 === 0 ? '#ff6b81' : '#f472b6',
                        phase: rand() * Math.PI * 2,
                        speed: randRange(2.2, 3.6)
                    });
                }
            }

            // Resize handler for HiDPI / Retina scaling and monospace grid calculation
            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const width = Math.max(1, window.innerWidth);
                const height = Math.max(1, window.innerHeight);

                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                // Crisp 11px-13px monospace grid sizing across mobile, tablet, and desktop
                const baseFont = Math.max(11, Math.min(13, Math.floor(Math.min(width, height) / 56)));
                cellH = baseFont;
                cellW = Math.max(6, Math.round(baseFont * 0.6));

                cols = Math.max(1, Math.ceil(width / cellW));
                rows = Math.max(1, Math.ceil(height / cellH));

                const total = cols * rows;
                zBuffer = new Float32Array(total);
                charBuffer = new Array(total);
                colorBuffer = new Array(total);
                glowBuffer = new Uint8Array(total);
            }

            // Write a character into the grid if closer than current Z-buffer value
            function plotCell(gx, gy, z, ch, color, glow = 0) {
                if (gx < 0 || gx >= cols || gy < 0 || gy >= rows || !Number.isFinite(z)) return;
                const idx = gy * cols + gx;
                if (z > zBuffer[idx]) {
                    zBuffer[idx] = z;
                    charBuffer[idx] = ch;
                    colorBuffer[idx] = color;
                    glowBuffer[idx] = glow > 0.5 ? 1 : 0;
                }
            }

            // Draw ambient background particles onto the grid (behind the 3D bouquet)
            function renderAmbient(t) {
                for (let i = 0; i < ambientParticles.length; i++) {
                    const p = ambientParticles[i];
                    const x = ((p.nx + p.vx * t) % 1 + 1) % 1;
                    const y = ((p.ny + p.vy * t) % 1 + 1) % 1;
                    const gx = Math.floor(x * cols);
                    const gy = Math.floor(y * rows);
                    const twinkle = Math.sin(t * p.speed + p.phase);

                    if (p.kind === 'dot') {
                        plotCell(gx, gy, -10, '.', p.color, 0);
                    } else if (p.kind === 'ring') {
                        plotCell(gx, gy, -10, twinkle > 0 ? 'o' : '.', p.color, 0.6);
                    } else if (p.kind === 'plus') {
                        plotCell(gx, gy, -10, twinkle > 0.2 ? '+' : '*', p.color, 0.7);
                    } else if (p.kind === 'sparkleCluster') {
                        plotCell(gx, gy, -10, twinkle > 0 ? '+' : 'o', p.color, 0.8);
                        plotCell(gx - 1, gy, -10, '.', '#94a3b8', 0);
                        plotCell(gx + 1, gy, -10, '.', '#94a3b8', 0);
                        plotCell(gx, gy - 1, -10, '.', '#94a3b8', 0);
                        plotCell(gx, gy + 1, -10, '.', '#94a3b8', 0);
                    } else if (p.kind === 'butterfly') {
                        // Alternating `(v)` and `\v/` wing frames
                        const flap = Math.sin(t * 5.0 + p.phase) > 0;
                        const topStr = flap ? '(v)' : '\\v/';
                        plotCell(gx - 1, gy, -9.5, topStr[0], p.color, 0.85);
                        plotCell(gx, gy, -9.5, topStr[1], '#feca57', 0.85);
                        plotCell(gx + 1, gy, -9.5, topStr[2], p.color, 0.85);
                        plotCell(gx, gy + 1, -9.5, 'v', p.color, 0.85);
                    }
                }
            }

            // Render subtle glowing pink ASCII quote framed at the very bottom
            function renderBottomQuote() {
                if (rows < 8 || cols < 24) return;
                const quoteText = MODE_QUOTES[currentModeIndex];
                const maxInner = Math.max(10, cols - 6);
                const clipped = quoteText.length > maxInner
                    ? quoteText.slice(0, maxInner)
                    : quoteText;

                const padded = ` ${clipped} `;
                const borderStr = '.'.repeat(padded.length);
                const startCol = Math.max(0, Math.floor((cols - padded.length) * 0.5));
                const midRow = rows - 2;

                for (let i = 0; i < padded.length; i++) {
                    plotCell(startCol + i, midRow - 1, 50, borderStr[i], '#9d4edd', 0.35);
                    plotCell(startCol + i, midRow, 50, padded[i], '#ff758f', 0.9);
                    plotCell(startCol + i, midRow + 1, 50, borderStr[i], '#9d4edd', 0.35);
                }
            }

            // Main animation loop
            function animate(now) {
                const dt = lastTime ? Math.min(0.05, Math.max(0, (now - lastTime) * 0.001)) : 0.016;
                lastTime = now;
                const t = now * 0.001;

                // Smoothly advance bloom transition after a click (~0.0035 rad/frame rotation pace)
                if (transitionProgress < 1) {
                    transitionProgress = Math.min(1, transitionProgress + dt * 1.35);
                }
                const bloomEase = 1 - Math.pow(1 - transitionProgress, 3);

                // Clear buffers
                zBuffer.fill(-999);
                charBuffer.fill(null);
                glowBuffer.fill(0);

                // 1. Render background ambient ASCII particles
                renderAmbient(t);

                // 2. Slow, hypnotic 3D rotation (~0.0035 rad/frame at 60fps => ~0.21 rad/sec) + gentle sway
                spinAngle += 0.21 * dt;
                const swayZ = Math.sin(t * 0.35) * 0.042;
                const swayX = 0.16 + Math.cos(t * 0.28) * 0.028;

                const cosY = Math.cos(spinAngle);
                const sinY = Math.sin(spinAngle);
                const cosX = Math.cos(swayX);
                const sinX = Math.sin(swayX);
                const cosZ = Math.cos(swayZ);
                const sinZ = Math.sin(swayZ);

                // Responsive bouquet scale in character grid units
                const scaleY = rows * 0.41;
                const scaleX = scaleY * (cellH / cellW);
                const centerX = cols * 0.5;
                const centerY = rows * 0.47;
                const cameraDist = 3.4;

                // Project and rasterize every 3D bouquet point into the ASCII grid
                for (let i = 0; i < bouquetPoints.length; i++) {
                    const pt = bouquetPoints[i];

                    const heightFactor = Math.max(0, (pt.y + 1.06) * 0.5);
                    const breezeX = Math.sin(t * 0.85 + pt.phase) * 0.008 * heightFactor;

                    // Smooth bloom unfold interpolation when switching flower modes
                    const unfold = 0.22 + 0.78 * bloomEase;
                    const px0 = (pt.x + breezeX) * unfold;
                    const py0 = -1.06 + (pt.y + 1.06) * (0.35 + 0.65 * bloomEase);
                    const pz0 = pt.z * unfold;

                    // Rotate around Y axis
                    const x1 = px0 * cosY - pz0 * sinY;
                    const z1 = px0 * sinY + pz0 * cosY;
                    const y1 = py0;

                    // Rotate around Z axis (gentle sway)
                    const x2 = x1 * cosZ - y1 * sinZ;
                    const y2 = x1 * sinZ + y1 * cosZ;
                    const z2 = z1;

                    // Tilt slightly toward camera (X axis)
                    const y3 = y2 * cosX - z2 * sinX;
                    const z3 = y2 * sinX + z2 * cosX;
                    const x3 = x2;

                    // Perspective projection
                    const denom = Math.max(0.5, cameraDist - z3);
                    const persp = cameraDist / denom;
                    const gx = Math.round(centerX + x3 * scaleX * persp);
                    const gy = Math.round(centerY - y3 * scaleY * persp);

                    const tangentVel = z1 * 0.48;

                    let ch = pt.customChar;
                    if (pt.type === 'stem') {
                        const slope = x3 / Math.max(0.25, y3 + 1.15);
                        if (slope < -0.38) ch = '\\';
                        else if (slope < -0.14) ch = '`';
                        else if (slope > 0.38) ch = '/';
                        else if (slope > 0.14) ch = ',';
                        else ch = (Math.abs(gx + gy) % 3 === 0) ? ':' : '|';
                    } else if (pt.type === 'wrap') {
                        ch = (gy % 2 === 0) ? '+' : '=';
                    }

                    plotCell(gx, gy, z3, ch, pt.color, pt.glow);

                    // Subtle horizontal ASCII scanline trails (-, =, .) on outer rotating blooms
                    if ((pt.type === 'petal' || pt.type === 'core') && Math.abs(tangentVel) > 0.22) {
                        const trailDir = tangentVel > 0 ? -1 : 1;
                        const trailCh = Math.abs(tangentVel) > 0.38 ? '=' : '-';
                        plotCell(gx + trailDir, gy, z3 - 0.04, trailCh, pt.color, 0.2);
                        if (Math.abs(tangentVel) > 0.42) {
                            plotCell(gx + trailDir * 2, gy, z3 - 0.08, '.', pt.color, 0);
                        }
                    }
                }

                // 3. Render subtle glowing pink ASCII quote at the very bottom
                renderBottomQuote();

                // 4. Draw dark charcoal-slate vignette background (#2b303a to #1a1e26) and ASCII grid
                const width = window.innerWidth;
                const height = window.innerHeight;

                const bgGrad = ctx.createRadialGradient(
                    width * 0.5, height * 0.48, width * 0.04,
                    width * 0.5, height * 0.5, Math.max(width, height) * 0.78
                );
                bgGrad.addColorStop(0, '#2b303a');
                bgGrad.addColorStop(0.6, '#212630');
                bgGrad.addColorStop(1, '#1a1e26');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, width, height);

                ctx.font = `600 ${cellH}px "Courier New", Consolas, Monaco, monospace`;
                ctx.textBaseline = 'top';

                for (let r = 0; r < rows; r++) {
                    const py = r * cellH;
                    const rowOffset = r * cols;
                    for (let c = 0; c < cols; c++) {
                        const idx = rowOffset + c;
                        const ch = charBuffer[idx];
                        if (!ch) continue;

                        const px = c * cellW;
                        const col = colorBuffer[idx];

                        if (glowBuffer[idx]) {
                            ctx.shadowColor = col;
                            ctx.shadowBlur = 7;
                        } else {
                            ctx.shadowBlur = 0;
                        }

                        ctx.fillStyle = col;
                        ctx.fillText(ch, px, py);
                    }
                }

                ctx.shadowBlur = 0;
                requestAnimationFrame(animate);
            }

            // Initialize geometry, listeners, and start animation
            buildBouquetGeometry(FLOWER_MODES[currentModeIndex]);
            buildAmbientParticles();
            resize();
            window.addEventListener('resize', resize);
            canvas.addEventListener('pointerdown', cycleFlowerVariety);
            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
