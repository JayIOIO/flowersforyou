<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D ASCII Wildflower Bouquet</title>
    <style>
        /* Reset and full-screen mobile-first terminal canvas */
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sar: env(safe-area-inset-right, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            min-height: 100svh;
            min-height: 100dvh;
            background-color: #181c24;
            overflow: hidden;
            overscroll-behavior: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            height: 100svh;
            height: 100dvh;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <canvas id="asciiCanvas"></canvas>

    <script>
        (function () {
            const canvas = document.getElementById('asciiCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            // Deterministic pseudo-random generator for reproducible botanical geometry
            let seed = 8842;
            function rand() {
                seed = (seed * 1664525 + 1013904223) % 4294967296;
                return seed / 4294967296;
            }
            function randRange(min, max) {
                return min + rand() * (max - min);
            }

            // Viewport & safe-area metrics
            let viewW = 390;
            let viewH = 844;
            let safeTop = 0;
            let safeBottom = 0;
            let safeLeft = 0;
            let safeRight = 0;

            // High-density monospace ASCII grid & Z-buffer state
            let cols = 0;
            let rows = 0;
            let cellW = 5;
            let cellH = 8;
            let zBuffer = new Float32Array(0);
            let charBuffer = [];
            let colorBuffer = [];
            let glowBuffer = new Uint8Array(0);
            let cachedBgGrad = null;

            // Color palettes matching the terminal wildflower aesthetic
            const STEM_PALETTE = [
                '#648a73', '#759e83', '#88b395', '#557863', '#9ac2a4', '#add4b7'
            ];

            const FLOWER_THEMES = [
                { name: 'coral',      inner: ['#ffd166', '#ffb703', '#ffffff'], outer: ['#ff5d78', '#ff758f', '#ff8fa3'], accent: '#ffc2d1' },
                { name: 'amber',      inner: ['#ffffff', '#fff3b0', '#ff9f1c'], outer: ['#feca57', '#ffbe0b', '#ffd166'], accent: '#ffeaa7' },
                { name: 'periwinkle', inner: ['#ffffff', '#fef08a', '#bae6fd'], outer: ['#54a0ff', '#60a5fa', '#3b82f6'], accent: '#bfdbfe' },
                { name: 'lavender',   inner: ['#fef08a', '#ffffff', '#f5d0fe'], outer: ['#a29bfe', '#c084fc', '#b794f4'], accent: '#e9d5ff' },
                { name: 'cream',      inner: ['#feca57', '#ff9f43', '#ff6b81'], outer: ['#f5f6fa', '#e2e8f0', '#fef9c3'], accent: '#ffffff' }
            ];

            // 3D point cloud structures and dynamic bounding box
            const bouquetPoints = [];
            const ambientParticles = [];
            let bounds = { minY: -1.12, maxY: 1.15, maxRadiusXZ: 1.05 };

            // Flower arrangement cycling state (0: Wildflowers, 1: Sunflowers, 2: Tulips, 3: Mixed Garden)
            const FLOWER_MODES = ['wildflowers', 'sunflowers', 'tulips', 'mixed'];
            const MODE_QUOTES = [
                'you are my forever soulmate',
                'you are my sunshine in every season',
                'blooming endlessly just for you',
                'a handpicked garden made to last forever'
            ];
            let currentModeIndex = 0;
            let transitionProgress = 1;
            let lastTime = 0;
            let spinAngle = 0;
            let lastSwitchTimestamp = 0;
            let activePointerId = null;
            let pointerDownX = 0;
            let pointerDownY = 0;

            /**
             * Measure CSS safe-area insets accurately on notched iOS/Android devices
             */
            function readSafeAreaInsets() {
                const probe = document.createElement('div');
                probe.style.cssText = 'position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);pointer-events:none;visibility:hidden;';
                document.body.appendChild(probe);
                const rect = probe.getBoundingClientRect();
                safeTop = Math.max(0, rect.top);
                safeLeft = Math.max(0, rect.left);
                safeRight = Math.max(0, window.innerWidth - rect.right);
                safeBottom = Math.max(0, window.innerHeight - rect.bottom);
                document.body.removeChild(probe);
            }

            /**
             * Helper: Oriented 3D local transform for flower heads
             */
            function createTransform(fx, fy, fz, tiltX, tiltZ) {
                const cosTX = Math.cos(tiltX), sinTX = Math.sin(tiltX);
                const cosTZ = Math.cos(tiltZ), sinTZ = Math.sin(tiltZ);
                return function (lx, ly, lz) {
                    const x1 = lx * cosTZ - ly * sinTZ;
                    const y1 = lx * sinTZ + ly * cosTZ;
                    const z1 = lz;

                    const y2 = y1 * cosTX - z1 * sinTX;
                    const z2 = y1 * sinTX + z1 * cosTX;
                    return {
                        x: fx + x1,
                        y: fy + y2,
                        z: fz + z2
                    };
                };
            }

            /**
             * Helper: Adds a green calyx / sepal base cup underneath a flower head
             */
            function addCalyxCup(transformLocal, radius, height) {
                const sepalCount = 6;
                for (let s = 0; s < sepalCount; s++) {
                    const a = (s / sepalCount) * Math.PI * 2;
                    for (let rStep = 1; rStep <= 4; rStep++) {
                        const rf = rStep / 4;
                        const r = radius * rf;
                        const ly = -height * (1 - rf * 0.65);
                        const pos = transformLocal(Math.cos(a) * r, ly, Math.sin(a) * r);
                        bouquetPoints.push({
                            x: pos.x,
                            y: pos.y,
                            z: pos.z,
                            color: rStep > 2 ? '#88b395' : '#557863',
                            type: 'leaf',
                            customChar: rStep === 4 ? '^' : '#',
                            phase: rand() * Math.PI * 2,
                            glow: 0.25
                        });
                    }
                }
            }

            /**
             * Helper: Adds an ultra-detailed, multi-tiered wildflower bloom at (fx, fy, fz)
             */
            function addWildflowerHead(fx, fy, fz, theme, scale, tiltX, tiltZ) {
                const bloomRadius = 0.165 * scale;
                const transformLocal = createTransform(fx, fy, fz, tiltX, tiltZ);

                addCalyxCup(transformLocal, bloomRadius * 0.45, 0.04 * scale);

                // Dense central stamen & pollen cluster
                const coreChars = ['@', '#', '0', 'O', 'o', '*', '+'];
                for (let c = 0; c < 30; c++) {
                    const frac = c / 30;
                    const r = Math.sqrt(frac) * bloomRadius * 0.36;
                    const a = c * 2.39996323;
                    const h = (1 - frac * 0.7) * 0.048 * scale;
                    const pos = transformLocal(Math.cos(a) * r, h, Math.sin(a) * r);
                    bouquetPoints.push({
                        x: pos.x,
                        y: pos.y,
                        z: pos.z,
                        color: theme.inner[c % theme.inner.length],
                        type: 'core',
                        customChar: coreChars[c % coreChars.length],
                        phase: rand() * Math.PI * 2,
                        glow: 0.92
                    });
                }

                // Double-tiered ruffled corolla petals
                const petalCount = Math.floor(randRange(6, 9));
                const petalChars = ['O', '0', 'o', '#', '*', '+', '=', ':'];
                for (let tier = 0; tier < 2; tier++) {
                    const tierScale = tier === 0 ? 1.0 : 0.74;
                    const tierLift = tier === 0 ? 0.025 : 0.052;
                    const angleOffset = tier * (Math.PI / petalCount);

                    for (let p = 0; p < petalCount; p++) {
                        const baseAngle = (p / petalCount) * Math.PI * 2 + angleOffset + randRange(-0.1, 0.1);
                        const pLen = bloomRadius * tierScale * randRange(0.92, 1.18);
                        const pWidth = bloomRadius * tierScale * randRange(0.46, 0.64);
                        const cupLift = tierLift + randRange(0.01, 0.04);

                        const radialSteps = 8;
                        const angularSteps = 6;
                        for (let rs = 1; rs <= radialSteps; rs++) {
                            const rf = rs / radialSteps;
                            const envelope = Math.sin(rf * Math.PI * 0.88);
                            for (let as = -angularSteps; as <= angularSteps; as++) {
                                const af = as / angularSteps;
                                if (Math.abs(af) > envelope + 0.14) continue;

                                const localDist = rf * pLen;
                                const spreadAngle = baseAngle + af * (pWidth / Math.max(0.04, pLen));
                                const lx = Math.cos(spreadAngle) * localDist;
                                const lz = Math.sin(spreadAngle) * localDist;
                                const ly = Math.pow(rf, 1.45) * cupLift - Math.abs(af) * 0.014;

                                const pos = transformLocal(lx, ly, lz);
                                const isEdge = rf > 0.82 || Math.abs(af) > envelope * 0.84;
                                const colorPool = isEdge ? theme.outer : [theme.accent, ...theme.outer];
                                const col = colorPool[(rs + Math.abs(as) + p + tier) % colorPool.length];
                                const ch = isEdge
                                    ? (rf > 0.91 ? '.' : 'o')
                                    : petalChars[(rs * 3 + Math.abs(as) + tier) % petalChars.length];

                                bouquetPoints.push({
                                    x: pos.x,
                                    y: pos.y,
                                    z: pos.z,
                                    color: col,
                                    type: 'petal',
                                    customChar: ch,
                                    phase: rand() * Math.PI * 2,
                                    glow: isEdge ? 0.58 : 0.82
                                });
                            }
                        }
                    }
                }
            }

            /**
             * Helper: Adds a giant, ultra-detailed 3D ASCII Sunflower head at (fx, fy, fz)
             * Wide Fibonacci phyllotaxis seed disc + double-ringed pointed golden ray petals + green sepal collar
             */
            function addSunflowerHead(fx, fy, fz, scale, tiltX, tiltZ) {
                const transformLocal = createTransform(fx, fy, fz, tiltX, tiltZ);
                const discRadius = 0.175 * scale;
                const petalOuterRadius = 0.365 * scale;

                addCalyxCup(transformLocal, discRadius * 0.92, 0.055 * scale);

                // 1. Dense Fibonacci Phyllotaxis seed disc (@, #, 0, *) in deep espresso brown & burnt amber
                const discColors = ['#3b2314', '#5c3317', '#78350f', '#92400e', '#451a03', '#b45309'];
                const discChars = ['@', '#', '0', '*', 'O', '+'];
                const seedCount = 175;
                for (let s = 0; s < seedCount; s++) {
                    const frac = s / seedCount;
                    const r = Math.sqrt(frac) * discRadius;
                    const angle = s * 2.39996323; // Golden angle spiral
                    const domeY = Math.cos(frac * Math.PI * 0.5) * 0.045 * scale;
                    const pos = transformLocal(Math.cos(angle) * r, domeY, Math.sin(angle) * r);

                    const isOuterFloret = frac > 0.78;
                    const col = isOuterFloret ? (frac > 0.9 ? '#f59e0b' : '#d97706') : discColors[s % discColors.length];
                    const ch = isOuterFloret ? (frac > 0.9 ? '*' : '0') : discChars[s % discChars.length];

                    bouquetPoints.push({
                        x: pos.x,
                        y: pos.y,
                        z: pos.z,
                        color: col,
                        type: 'core',
                        customChar: ch,
                        phase: rand() * Math.PI * 2,
                        glow: isOuterFloret ? 0.82 : 0.42
                    });
                }

                // 2. 22 pointed radiating golden-yellow sunflower ray petals in staggered double ring
                const rayCount = 22;
                const petalColors = ['#ffd166', '#ffb703', '#fca311', '#ffe066', '#f59e0b', '#fff3b0'];
                const rayChars = ['O', '0', 'o', '+', '*', ':'];
                for (let p = 0; p < rayCount; p++) {
                    const angle = (p / rayCount) * Math.PI * 2 + (p % 2) * 0.04;
                    const layerOffset = (p % 2 === 0) ? 0.012 : -0.008;
                    const pLen = petalOuterRadius * randRange(0.95, 1.08);
                    const pHalfWidth = 0.038 * scale;

                    for (let rs = 1; rs <= 10; rs++) {
                        const rf = rs / 10;
                        const dist = discRadius * 0.84 + rf * (pLen - discRadius * 0.84);
                        const widthEnv = Math.sin(rf * Math.PI) * (1 - rf * 0.32);
                        const wSteps = rf > 0.86 ? 0 : (rf > 0.65 ? 1 : 2);

                        for (let ws = -wSteps; ws <= wSteps; ws++) {
                            const wf = wSteps === 0 ? 0 : ws / wSteps;
                            const perp = wf * pHalfWidth * widthEnv;
                            const lx = Math.cos(angle) * dist - Math.sin(angle) * perp;
                            const lz = Math.sin(angle) * dist + Math.cos(angle) * perp;
                            const ly = layerOffset - Math.pow(rf, 1.75) * 0.028 + (1 - Math.abs(wf)) * 0.006;

                            const pos = transformLocal(lx, ly, lz);
                            const isTip = rf > 0.84;
                            const col = isTip ? '#fff3b0' : petalColors[(p + rs + Math.abs(ws)) % petalColors.length];
                            const ch = isTip ? (rf > 0.94 ? '*' : 'o') : rayChars[(rs + p + Math.abs(ws)) % rayChars.length];

                            bouquetPoints.push({
                                x: pos.x,
                                y: pos.y,
                                z: pos.z,
                                color: col,
                                type: 'petal',
                                customChar: ch,
                                phase: rand() * Math.PI * 2,
                                glow: isTip ? 0.88 : 0.75
                            });
                        }
                    }
                }
            }

            /**
             * Helper: Adds a sculpted 3D cup/goblet-shaped ASCII Tulip bloom at (fx, fy, fz)
             * Rounded base tapering gracefully with overlapping curved inner and outer tepals
             */
            function addTulipHead(fx, fy, fz, palette, scale, tiltX, tiltZ) {
                const transformLocal = createTransform(fx, fy, fz, tiltX, tiltZ);
                const cupHeight = 0.31 * scale;
                const cupRadius = 0.142 * scale;

                // Inner dark-tipped golden stamen filaments inside the goblet
                for (let c = 0; c < 18; c++) {
                    const a = (c / 18) * Math.PI * 2;
                    const r = (c % 3 === 0 ? 0.015 : 0.032) * scale;
                    const h = (0.06 + (c % 3) * 0.035) * scale;
                    const pos = transformLocal(Math.cos(a) * r, h, Math.sin(a) * r);
                    bouquetPoints.push({
                        x: pos.x,
                        y: pos.y,
                        z: pos.z,
                        color: h > 0.11 * scale ? '#3b2314' : '#ffd32a',
                        type: 'core',
                        customChar: h > 0.11 * scale ? '@' : '|',
                        phase: rand() * Math.PI * 2,
                        glow: 0.85
                    });
                }

                // 6 overlapping cupped tulip tepals (3 prominent outer scalloped tips + 3 inner tepals)
                const petalChars = ['(', ')', '0', 'O', 'o', '#', ':', '*'];
                for (let p = 0; p < 6; p++) {
                    const isOuter = p < 3;
                    const baseAngle = ((p % 3) / 3) * Math.PI * 2 + (isOuter ? 0 : Math.PI / 3);
                    const rScale = isOuter ? 1.06 : 0.86;
                    const hScale = isOuter ? 1.03 : 0.96;

                    const hSteps = 14;
                    const wSteps = 5;
                    for (let hs = 0; hs <= hSteps; hs++) {
                        const v = hs / hSteps;
                        const profileR = cupRadius * rScale * (0.28 + Math.sin(v * Math.PI * 0.78) * 0.86);
                        const angularSpan = (0.64 - v * 0.22) * (isOuter ? 1.08 : 0.92);

                        for (let ws = -wSteps; ws <= wSteps; ws++) {
                            const wf = ws / wSteps;
                            if (v > 0.68 && Math.abs(wf) > (1.06 - v) * 3.0) continue;

                            const theta = baseAngle + wf * angularSpan;
                            const r = profileR * (1 - Math.abs(wf) * 0.12);
                            const lx = Math.cos(theta) * r;
                            const lz = Math.sin(theta) * r;
                            const ly = v * cupHeight * hScale;

                            const pos = transformLocal(lx, ly, lz);
                            const isRim = v > 0.84 || Math.abs(wf) === 1;
                            const col = isRim
                                ? palette.rim
                                : palette.body[(hs + Math.abs(ws) + p) % palette.body.length];
                            const ch = isRim
                                ? (v > 0.91 ? '^' : 'o')
                                : (Math.abs(wf) === 1 ? (wf < 0 ? '(' : ')') : petalChars[(hs + p) % petalChars.length]);

                            bouquetPoints.push({
                                x: pos.x,
                                y: pos.y,
                                z: pos.z,
                                color: col,
                                type: 'petal',
                                customChar: ch,
                                phase: rand() * Math.PI * 2,
                                glow: isRim ? 0.85 : 0.68
                            });
                        }
                    }
                }
            }

            /**
             * Helper: Adds a lush spiral 3D ASCII Rose bloom at (fx, fy, fz)
             */
            function addRoseHead(fx, fy, fz, palette, scale, tiltX, tiltZ) {
                const transformLocal = createTransform(fx, fy, fz, tiltX, tiltZ);
                const maxR = 0.185 * scale;
                const turns = 4.2;
                const steps = 165;
                const roseChars = ['@', '0', 'O', 'o', '(', ')', '#', '*'];

                addCalyxCup(transformLocal, maxR * 0.55, 0.045 * scale);

                for (let i = 0; i < steps; i++) {
                    const frac = i / steps;
                    const angle = frac * turns * Math.PI * 2;
                    const r = (0.07 + frac * 0.93) * maxR;
                    const cupY = (1 - frac * 0.52) * 0.078 * scale + Math.sin(angle * 3) * 0.015;

                    for (let layer = 0; layer < 2; layer++) {
                        const ly = cupY - layer * 0.022 * scale;
                        const pos = transformLocal(Math.cos(angle) * r, ly, Math.sin(angle) * r);
                        const col = frac < 0.28
                            ? palette.core
                            : palette.body[(i + layer) % palette.body.length];
                        const ch = roseChars[(i + layer * 2) % roseChars.length];

                        bouquetPoints.push({
                            x: pos.x,
                            y: pos.y,
                            z: pos.z,
                            color: col,
                            type: frac < 0.25 ? 'core' : 'petal',
                            customChar: ch,
                            phase: rand() * Math.PI * 2,
                            glow: frac > 0.72 ? 0.86 : 0.68
                        });
                    }
                }
            }

            /**
             * Builds the ultra-detailed 3D bouquet point cloud and computes its exact 3D bounding box
             * so the camera scales it generously on both mobile portrait and desktop screens without clipping.
             */
            function buildBouquetGeometry(mode = 'wildflowers') {
                bouquetPoints.length = 0;
                seed = 8842 + currentModeIndex * 1337;

                const baseTip = { x: 0, y: -1.12, z: 0 };

                if (mode === 'wildflowers') {
                    const numFlowers = 28;
                    const flowers = [];

                    for (let i = 0; i < numFlowers; i++) {
                        const t = i / (numFlowers - 1);
                        const goldenAngle = i * 2.39996323;
                        const radialSpread = 0.14 + Math.pow(t, 0.72) * 0.88 + randRange(-0.05, 0.05);
                        const heightY = 1.02 - Math.pow(t, 1.15) * 0.84 + randRange(-0.07, 0.07);

                        const fx = Math.cos(goldenAngle) * radialSpread;
                        const fz = Math.sin(goldenAngle) * radialSpread;
                        const fy = heightY;

                        const theme = FLOWER_THEMES[i % FLOWER_THEMES.length];
                        const scale = randRange(0.82, 1.32);
                        const tiltX = Math.atan2(fz, fy + 1.15) * 0.65 + randRange(-0.18, 0.18);
                        const tiltZ = -Math.atan2(fx, fy + 1.15) * 0.65 + randRange(-0.18, 0.18);

                        flowers.push({ fx, fy, fz, theme, scale, tiltX, tiltZ });
                    }

                    flowers.forEach((fl, idx) => {
                        const strandCount = idx % 2 === 0 ? 3 : 2;
                        for (let s = 0; s < strandCount; s++) {
                            const offsetAngle = (s / strandCount) * Math.PI * 2 + idx;
                            const spreadFactor = s === 0 ? 0 : randRange(0.014, 0.042);
                            const endX = fl.fx + Math.cos(offsetAngle) * spreadFactor;
                            const endZ = fl.fz + Math.sin(offsetAngle) * spreadFactor;
                            const endY = fl.fy - 0.03;

                            const ctrlX = endX * 0.42 + Math.cos(offsetAngle) * 0.04;
                            const ctrlZ = endZ * 0.42 + Math.sin(offsetAngle) * 0.04;
                            const ctrlY = -0.38 + randRange(-0.08, 0.08);

                            const steps = 84;
                            for (let st = 0; st <= steps; st++) {
                                const u = st / steps;
                                const inv = 1 - u;
                                const px = inv * inv * baseTip.x + 2 * inv * u * ctrlX + u * u * endX;
                                const py = inv * inv * baseTip.y + 2 * inv * u * ctrlY + u * u * endY;
                                const pz = inv * inv * baseTip.z + 2 * inv * u * ctrlZ + u * u * endZ;

                                const color = STEM_PALETTE[(st + idx + s) % STEM_PALETTE.length];
                                const charType = (u < 0.28 && st % 3 === 0) ? 'wrap' : 'stem';

                                bouquetPoints.push({
                                    x: px,
                                    y: py,
                                    z: pz,
                                    color: color,
                                    type: charType,
                                    phase: rand() * Math.PI * 2,
                                    glow: u < 0.15 ? 0.3 : 0.15
                                });
                            }
                        }

                        addWildflowerHead(fl.fx, fl.fy, fl.fz, fl.theme, fl.scale, fl.tiltX, fl.tiltZ);
                    });

                    // Rich filler foliage, serrated leaves & baby's-breath clusters
                    for (let f = 0; f < 40; f++) {
                        const angle = (f / 40) * Math.PI * 2 + randRange(-0.2, 0.2);
                        const rad = randRange(0.24, 0.98);
                        const topY = randRange(-0.15, 0.92);
                        const tx = Math.cos(angle) * rad;
                        const tz = Math.sin(angle) * rad;

                        const steps = 54;
                        for (let st = 0; st <= steps; st++) {
                            const u = st / steps;
                            const px = tx * Math.pow(u, 0.92);
                            const pz = tz * Math.pow(u, 0.92);
                            const py = -1.12 + (topY + 1.12) * u;

                            bouquetPoints.push({
                                x: px,
                                y: py,
                                z: pz,
                                color: STEM_PALETTE[(f + st) % STEM_PALETTE.length],
                                type: 'stem',
                                phase: rand() * Math.PI * 2,
                                glow: 0.12
                            });

                            if (u > 0.42 && st % 5 === 0) {
                                const side = (st % 10 === 0) ? 1 : -1;
                                bouquetPoints.push({
                                    x: px - Math.sin(angle) * 0.05 * side,
                                    y: py + 0.016,
                                    z: pz + Math.cos(angle) * 0.05 * side,
                                    color: '#8eb899',
                                    type: 'leaf',
                                    customChar: side > 0 ? '/' : '\\',
                                    phase: rand() * Math.PI * 2,
                                    glow: 0.26
                                });
                            }
                        }

                        if (f % 2 === 0) {
                            for (let b = 0; b < 5; b++) {
                                bouquetPoints.push({
                                    x: tx + randRange(-0.045, 0.045),
                                    y: topY + randRange(-0.035, 0.045),
                                    z: tz + randRange(-0.045, 0.045),
                                    color: b % 2 === 0 ? '#f5f6fa' : '#feca57',
                                    type: 'speck',
                                    customChar: b === 0 ? 'o' : '.',
                                    phase: rand() * Math.PI * 2,
                                    glow: 0.68
                                });
                            }
                        }
                    }
                } else if (mode === 'sunflowers') {
                    const numSunflowers = 9;
                    for (let i = 0; i < numSunflowers; i++) {
                        const isCrown = i === 0;
                        const t = isCrown ? 0 : (i - 1) / (numSunflowers - 2);
                        const angle = i * 2.39996323;
                        const radialSpread = isCrown ? 0.04 : (0.30 + t * 0.56 + randRange(-0.03, 0.03));
                        const fy = isCrown ? 0.96 : (0.82 - t * 0.56 + randRange(-0.04, 0.04));
                        const fx = Math.cos(angle) * radialSpread;
                        const fz = Math.sin(angle) * radialSpread;
                        const scale = isCrown ? 1.28 : randRange(1.0, 1.20);

                        const tiltX = Math.atan2(fz, fy + 1.15) * 0.82 + 0.24;
                        const tiltZ = -Math.atan2(fx, fy + 1.15) * 0.82;

                        // Sturdy thick multi-strand ribbed sunflower stems
                        for (let s = 0; s < 5; s++) {
                            const sa = (s / 5) * Math.PI * 2;
                            const off = 0.018;
                            const endX = fx + Math.cos(sa) * off;
                            const endZ = fz + Math.sin(sa) * off;
                            const ctrlX = endX * 0.35;
                            const ctrlZ = endZ * 0.35;
                            const ctrlY = -0.38;

                            const steps = 86;
                            for (let st = 0; st <= steps; st++) {
                                const u = st / steps;
                                const inv = 1 - u;
                                const px = inv * inv * baseTip.x + 2 * inv * u * ctrlX + u * u * endX;
                                const py = inv * inv * baseTip.y + 2 * inv * u * ctrlY + u * u * (fy - 0.04);
                                const pz = inv * inv * baseTip.z + 2 * inv * u * ctrlZ + u * u * endZ;

                                bouquetPoints.push({
                                    x: px,
                                    y: py,
                                    z: pz,
                                    color: STEM_PALETTE[(st + i + s) % STEM_PALETTE.length],
                                    type: (u < 0.25 && st % 3 === 0) ? 'wrap' : 'stem',
                                    phase: rand() * Math.PI * 2,
                                    glow: 0.18
                                });

                                // Broad heart-shaped sunflower leaves with central vein along mid-stem
                                if (s === 0 && (st === 34 || st === 56)) {
                                    const leafSide = st === 34 ? 1 : -1;
                                    const lDirX = Math.cos(angle + leafSide * 1.1);
                                    const lDirZ = Math.sin(angle + leafSide * 1.1);
                                    for (let lr = 1; lr <= 8; lr++) {
                                        const lf = lr / 8;
                                        const span = Math.sin(lf * Math.PI) * 0.092;
                                        for (let lw = -3; lw <= 3; lw++) {
                                            const wf = lw / 3;
                                            bouquetPoints.push({
                                                x: px + lDirX * lf * 0.25 - lDirZ * wf * span,
                                                y: py + Math.sin(lf * Math.PI * 0.8) * 0.052 - lf * 0.03,
                                                z: pz + lDirZ * lf * 0.25 + lDirX * wf * span,
                                                color: lw === 0 ? '#add4b7' : (lr > 5 ? '#9ac2a4' : '#648a73'),
                                                type: 'leaf',
                                                customChar: lw === 0 ? '/' : (Math.abs(wf) === 1 ? '~' : '#'),
                                                phase: rand() * Math.PI * 2,
                                                glow: 0.26
                                            });
                                        }
                                    }
                                }
                            }
                        }

                        addSunflowerHead(fx, fy, fz, scale, tiltX, tiltZ);
                    }
                } else if (mode === 'tulips') {
                    const tulipPalettes = [
                        { body: ['#ff4d6d', '#ff758f', '#c9184a', '#ff8fa3'], rim: '#fff0f3' },
                        { body: ['#ff9f43', '#ff7b00', '#ffaa00', '#ff6b35'], rim: '#fff3b0' },
                        { body: ['#ffd32a', '#ffdd00', '#ffea00', '#ffb700'], rim: '#fffffc' },
                        { body: ['#9b59b6', '#c77dff', '#8e44ad', '#e0aaff'], rim: '#f3d5ff' }
                    ];

                    const numTulips = 14;
                    for (let i = 0; i < numTulips; i++) {
                        const t = i / (numTulips - 1);
                        const angle = i * 2.39996323;
                        const radialSpread = 0.12 + Math.pow(t, 0.78) * 0.70 + randRange(-0.03, 0.03);
                        const fy = 0.90 - Math.pow(t, 1.1) * 0.68 + randRange(-0.04, 0.04);
                        const fx = Math.cos(angle) * radialSpread;
                        const fz = Math.sin(angle) * radialSpread;
                        const palette = tulipPalettes[i % tulipPalettes.length];
                        const scale = randRange(0.96, 1.22);

                        const tiltX = Math.atan2(fz, fy + 1.2) * 0.55;
                        const tiltZ = -Math.atan2(fx, fy + 1.2) * 0.55;

                        for (let s = 0; s < 3; s++) {
                            const off = s === 0 ? 0 : 0.012;
                            const endX = fx + Math.cos(angle + s * 2.1) * off;
                            const endZ = fz + Math.sin(angle + s * 2.1) * off;
                            const ctrlX = endX * 0.32;
                            const ctrlZ = endZ * 0.32;
                            const ctrlY = -0.35;

                            const steps = 82;
                            for (let st = 0; st <= steps; st++) {
                                const u = st / steps;
                                const inv = 1 - u;
                                const px = inv * inv * baseTip.x + 2 * inv * u * ctrlX + u * u * endX;
                                const py = inv * inv * baseTip.y + 2 * inv * u * ctrlY + u * u * fy;
                                const pz = inv * inv * baseTip.z + 2 * inv * u * ctrlZ + u * u * endZ;

                                bouquetPoints.push({
                                    x: px,
                                    y: py,
                                    z: pz,
                                    color: STEM_PALETTE[(st + i) % STEM_PALETTE.length],
                                    type: (u < 0.25 && st % 3 === 0) ? 'wrap' : 'stem',
                                    phase: rand() * Math.PI * 2,
                                    glow: 0.16
                                });
                            }
                        }

                        addTulipHead(fx, fy, fz, palette, scale, tiltX, tiltZ);
                    }

                    // Sweeping folded lanceolate tulip leaves
                    const leafCount = 14;
                    for (let l = 0; l < leafCount; l++) {
                        const la = (l / leafCount) * Math.PI * 2 + 0.2;
                        const leafHeight = randRange(0.32, 0.82);
                        const archOut = randRange(0.52, 0.90);
                        const steps = 58;

                        for (let st = 0; st <= steps; st++) {
                            const u = st / steps;
                            const widthEnv = Math.sin(u * Math.PI * 0.92);
                            const r = Math.pow(u, 1.35) * archOut;
                            const py = -1.08 + (leafHeight + 1.08) * Math.sin(u * Math.PI * 0.56);
                            const cx = Math.cos(la) * r;
                            const cz = Math.sin(la) * r;

                            const perpX = -Math.sin(la);
                            const perpZ = Math.cos(la);
                            const halfW = widthEnv * 0.062;

                            for (let w = -2; w <= 2; w++) {
                                const wf = w / 2;
                                bouquetPoints.push({
                                    x: cx + perpX * wf * halfW,
                                    y: py,
                                    z: cz + perpZ * wf * halfW,
                                    color: w === 0 ? '#add4b7' : (u > 0.7 ? '#9ac2a4' : '#759e83'),
                                    type: 'leaf',
                                    customChar: w === 0 ? '|' : (w < 0 ? '(' : ')'),
                                    phase: rand() * Math.PI * 2,
                                    glow: 0.24
                                });
                            }
                        }
                    }
                } else {
                    // Mode 3 ('mixed'): Spiral 3D roses, giant sunflowers, sculpted tulips & wildflowers
                    const numBlooms = 20;
                    const rosePalettes = [
                        { core: '#fff0f3', body: ['#ff4d6d', '#ff758f', '#ff8fa3', '#c9184a'] },
                        { core: '#fff8e7', body: ['#ffb703', '#fb8500', '#ffd166', '#f77f00'] },
                        { core: '#f3e8ff', body: ['#c084fc', '#a855f7', '#e879f9', '#9333ea'] }
                    ];
                    const tulipPal = { body: ['#ff4d6d', '#ff99ac', '#ff758f', '#ffe5ec'], rim: '#ffffff' };

                    for (let i = 0; i < numBlooms; i++) {
                        const t = i / (numBlooms - 1);
                        const angle = i * 2.39996323;
                        const radialSpread = 0.14 + Math.pow(t, 0.76) * 0.78;
                        const fy = 0.96 - Math.pow(t, 1.12) * 0.76 + randRange(-0.04, 0.04);
                        const fx = Math.cos(angle) * radialSpread;
                        const fz = Math.sin(angle) * radialSpread;
                        const tiltX = Math.atan2(fz, fy + 1.15) * 0.68;
                        const tiltZ = -Math.atan2(fx, fy + 1.15) * 0.68;

                        for (let s = 0; s < 3; s++) {
                            const off = s * 0.012;
                            const endX = fx + Math.cos(angle + s * 2.1) * off;
                            const endZ = fz + Math.sin(angle + s * 2.1) * off;
                            const ctrlX = endX * 0.38;
                            const ctrlZ = endZ * 0.38;
                            const ctrlY = -0.36;
                            const steps = 80;
                            for (let st = 0; st <= steps; st++) {
                                const u = st / steps;
                                const inv = 1 - u;
                                bouquetPoints.push({
                                    x: inv * inv * baseTip.x + 2 * inv * u * ctrlX + u * u * endX,
                                    y: inv * inv * baseTip.y + 2 * inv * u * ctrlY + u * u * (fy - 0.03),
                                    z: inv * inv * baseTip.z + 2 * inv * u * ctrlZ + u * u * endZ,
                                    color: STEM_PALETTE[(st + i) % STEM_PALETTE.length],
                                    type: (u < 0.25 && st % 3 === 0) ? 'wrap' : 'stem',
                                    phase: rand() * Math.PI * 2,
                                    glow: 0.16
                                });
                            }
                        }

                        const kind = i % 4;
                        if (kind === 0) {
                            addSunflowerHead(fx, fy, fz, 0.92, tiltX, tiltZ);
                        } else if (kind === 1) {
                            addTulipHead(fx, fy, fz, tulipPal, 1.04, tiltX, tiltZ);
                        } else if (kind === 2) {
                            addRoseHead(fx, fy, fz, rosePalettes[i % rosePalettes.length], 1.08, tiltX, tiltZ);
                        } else {
                            addWildflowerHead(fx, fy, fz, FLOWER_THEMES[(i + 2) % FLOWER_THEMES.length], 1.16, tiltX, tiltZ);
                        }
                    }
                }

                // Compute exact 3D bounding box for lossless mobile & desktop viewport framing
                let minY = Infinity;
                let maxY = -Infinity;
                let maxR = 0.2;
                for (let i = 0; i < bouquetPoints.length; i++) {
                    const p = bouquetPoints[i];
                    if (p.y < minY) minY = p.y;
                    if (p.y > maxY) maxY = p.y;
                    const r = Math.hypot(p.x, p.z);
                    if (r > maxR) maxR = r;
                }
                bounds = {
                    minY: Number.isFinite(minY) ? minY : -1.12,
                    maxY: Number.isFinite(maxY) ? maxY : 1.15,
                    maxRadiusXZ: Math.max(0.4, maxR)
                };
            }

            /**
             * Unified primary-pointer tap/click handler so scrolling or multi-touch never misfires
             */
            function onPointerDown(e) {
                if (!e.isPrimary) return;
                activePointerId = e.pointerId;
                pointerDownX = e.clientX;
                pointerDownY = e.clientY;
            }

            function onPointerUp(e) {
                if (!e.isPrimary || e.pointerId !== activePointerId) return;
                activePointerId = null;

                const movedDist = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
                if (movedDist > 18) return;

                const now = performance.now();
                if (now - lastSwitchTimestamp < 220) return;
                lastSwitchTimestamp = now;

                currentModeIndex = (currentModeIndex + 1) % FLOWER_MODES.length;
                transitionProgress = 0;
                buildBouquetGeometry(FLOWER_MODES[currentModeIndex]);
            }

            function onPointerCancel() {
                activePointerId = null;
            }

            /**
             * Builds floating background ASCII particles scaled smoothly to screen size
             */
            function buildAmbientParticles() {
                ambientParticles.length = 0;
                const isCompact = Math.min(viewW, viewH) < 600;
                const sparkleCount = isCompact ? 68 : 105;
                const butterflyCount = isCompact ? 4 : 6;

                for (let i = 0; i < sparkleCount; i++) {
                    const kinds = ['dot', 'dot', 'ring', 'plus', 'sparkleCluster'];
                    const kind = kinds[Math.floor(rand() * kinds.length)];
                    const colors = [
                        '#94a3b8', '#cbd5e1', '#feca57', '#ff6b81',
                        '#54a0ff', '#a29bfe', '#8eb899', '#f5f6fa'
                    ];
                    ambientParticles.push({
                        nx: rand(),
                        ny: rand(),
                        vx: randRange(-0.008, 0.008),
                        vy: randRange(-0.014, -0.003),
                        kind: kind,
                        color: colors[Math.floor(rand() * colors.length)],
                        phase: rand() * Math.PI * 2,
                        speed: randRange(1.2, 3.0)
                    });
                }

                for (let b = 0; b < butterflyCount; b++) {
                    ambientParticles.push({
                        nx: randRange(0.06, 0.94),
                        ny: randRange(0.06, 0.86),
                        vx: randRange(-0.012, 0.012),
                        vy: randRange(-0.01, 0.006),
                        kind: 'butterfly',
                        color: b % 2 === 0 ? '#ff6b81' : '#f472b6',
                        phase: rand() * Math.PI * 2,
                        speed: randRange(2.2, 3.6)
                    });
                }
            }

            /**
             * Resize handler:
             * - Fine monospace cells (`6.5px–8.5px` on mobile phones, `9px–11px` on tablets/desktops)
             *   give ultra-high ASCII resolution while keeping every stem and petal huge & detailed.
             */
            function resize() {
                readSafeAreaInsets();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                viewW = Math.max(1, window.innerWidth);
                viewH = Math.max(1, window.innerHeight);

                canvas.width = Math.floor(viewW * dpr);
                canvas.height = Math.floor(viewH * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                const shortEdge = Math.min(viewW, viewH);
                let baseFont;
                if (shortEdge < 480) {
                    // Mobile portrait phones: 7px - 8.5px ultra-crisp high-density cells
                    baseFont = Math.max(7, Math.min(8.5, Math.round((shortEdge / 50) * 2) / 2));
                } else if (shortEdge < 820) {
                    // Tablets & large phones: 8.5px - 10px
                    baseFont = Math.max(8.5, Math.min(10, Math.round((shortEdge / 68) * 2) / 2));
                } else {
                    // Desktop monitors: 10px - 11px
                    baseFont = Math.max(10, Math.min(11, Math.floor(shortEdge / 82)));
                }

                cellH = baseFont;
                cellW = Math.max(4.2, +(baseFont * 0.6).toFixed(2));

                cols = Math.max(1, Math.ceil(viewW / cellW));
                rows = Math.max(1, Math.ceil(viewH / cellH));

                const total = cols * rows;
                zBuffer = new Float32Array(total);
                charBuffer = new Array(total);
                colorBuffer = new Array(total);
                glowBuffer = new Uint8Array(total);

                // Cache radial vignette background gradient on resize
                cachedBgGrad = ctx.createRadialGradient(
                    viewW * 0.5, viewH * 0.47, viewW * 0.04,
                    viewW * 0.5, viewH * 0.5, Math.max(viewW, viewH) * 0.8
                );
                cachedBgGrad.addColorStop(0, '#2b303a');
                cachedBgGrad.addColorStop(0.6, '#202530');
                cachedBgGrad.addColorStop(1, '#181c24');

                buildAmbientParticles();
            }

            // Write a character into the grid if closer than current Z-buffer value
            function plotCell(gx, gy, z, ch, color, glow = 0) {
                if (gx < 0 || gx >= cols || gy < 0 || gy >= rows || !Number.isFinite(z)) return;
                const idx = gy * cols + gx;
                if (z > zBuffer[idx]) {
                    zBuffer[idx] = z;
                    charBuffer[idx] = ch;
                    colorBuffer[idx] = color;
                    glowBuffer[idx] = glow > 0.5 ? 1 : 0;
                }
            }

            // Draw ambient background particles onto the grid (behind the 3D bouquet)
            function renderAmbient(t) {
                for (let i = 0; i < ambientParticles.length; i++) {
                    const p = ambientParticles[i];
                    const x = ((p.nx + p.vx * t) % 1 + 1) % 1;
                    const y = ((p.ny + p.vy * t) % 1 + 1) % 1;
                    const gx = Math.floor(x * cols);
                    const gy = Math.floor(y * rows);
                    const twinkle = Math.sin(t * p.speed + p.phase);

                    if (p.kind === 'dot') {
                        plotCell(gx, gy, -10, '.', p.color, 0);
                    } else if (p.kind === 'ring') {
                        plotCell(gx, gy, -10, twinkle > 0 ? 'o' : '.', p.color, 0.6);
                    } else if (p.kind === 'plus') {
                        plotCell(gx, gy, -10, twinkle > 0.2 ? '+' : '*', p.color, 0.7);
                    } else if (p.kind === 'sparkleCluster') {
                        plotCell(gx, gy, -10, twinkle > 0 ? '+' : 'o', p.color, 0.8);
                        plotCell(gx - 1, gy, -10, '.', '#94a3b8', 0);
                        plotCell(gx + 1, gy, -10, '.', '#94a3b8', 0);
                        plotCell(gx, gy - 1, -10, '.', '#94a3b8', 0);
                        plotCell(gx, gy + 1, -10, '.', '#94a3b8', 0);
                    } else if (p.kind === 'butterfly') {
                        const flap = Math.sin(t * 5.0 + p.phase) > 0;
                        const topStr = flap ? '(v)' : '\\v/';
                        plotCell(gx - 1, gy, -9.5, topStr[0], p.color, 0.85);
                        plotCell(gx, gy, -9.5, topStr[1], '#feca57', 0.85);
                        plotCell(gx + 1, gy, -9.5, topStr[2], p.color, 0.85);
                        plotCell(gx, gy + 1, -9.5, 'v', p.color, 0.85);
                    }
                }
            }

            /**
             * Wraps long quotes onto up to 2 balanced lines on narrow portrait mobile screens
             */
            function wrapQuoteLines(text, maxInnerWidth) {
                if (text.length <= maxInnerWidth) return [text];
                const words = text.split(' ');
                const lines = [];
                let current = '';

                for (let i = 0; i < words.length; i++) {
                    const word = words[i];
                    if (!current) {
                        current = word.slice(0, maxInnerWidth);
                    } else if (current.length + 1 + word.length <= maxInnerWidth) {
                        current += ' ' + word;
                    } else {
                        lines.push(current);
                        current = word.slice(0, maxInnerWidth);
                        if (lines.length === 1) break;
                    }
                }
                if (current && lines.length < 2) {
                    lines.push(current);
                }
                return lines;
            }

            // Render subtle glowing pink ASCII quote inside a dotted border above bottom safe-area inset
            function renderBottomQuote() {
                if (rows < 10 || cols < 18) return;
                const quoteText = MODE_QUOTES[currentModeIndex];
                const sidePadCols = Math.ceil(Math.max(safeLeft, safeRight) / cellW) + 2;
                const maxInner = Math.max(12, cols - sidePadCols * 2 - 2);
                const lines = wrapQuoteLines(quoteText, maxInner);

                const boxWidth = Math.max(...lines.map(l => l.length)) + 2;
                const borderStr = '.'.repeat(boxWidth);
                const startCol = Math.max(0, Math.floor((cols - boxWidth) * 0.5));
                const bottomPadRows = Math.ceil(safeBottom / cellH) + 1;
                const bottomBorderRow = rows - 1 - bottomPadRows;
                const topBorderRow = bottomBorderRow - lines.length - 1;

                if (topBorderRow < 2) return;

                for (let i = 0; i < boxWidth; i++) {
                    plotCell(startCol + i, topBorderRow, 50, borderStr[i], '#9d4edd', 0.35);
                    plotCell(startCol + i, bottomBorderRow, 50, borderStr[i], '#9d4edd', 0.35);
                }

                for (let l = 0; l < lines.length; l++) {
                    const line = lines[l];
                    const leftPad = Math.floor((boxWidth - line.length) * 0.5);
                    const padded = ' '.repeat(leftPad) + line + ' '.repeat(boxWidth - line.length - leftPad);
                    const rowY = topBorderRow + 1 + l;
                    for (let i = 0; i < boxWidth; i++) {
                        plotCell(startCol + i, rowY, 50, padded[i], '#ff758f', 0.92);
                    }
                }

                return topBorderRow;
            }

            // Main animation loop
            function animate(now) {
                const dt = lastTime ? Math.min(0.05, Math.max(0, (now - lastTime) * 0.001)) : 0.016;
                lastTime = now;
                const t = now * 0.001;

                // Smoothly advance bloom transition after a tap/click
                if (transitionProgress < 1) {
                    transitionProgress = Math.min(1, transitionProgress + dt * 1.35);
                }
                const bloomEase = 1 - Math.pow(1 - transitionProgress, 3);

                // Clear buffers
                zBuffer.fill(-999);
                charBuffer.fill(null);
                glowBuffer.fill(0);

                // 1. Render background ambient ASCII particles
                renderAmbient(t);

                // 2. Render bottom ASCII quote first so we know exact safe vertical headroom
                const quoteTopRow = renderBottomQuote() || (rows - 4);

                // 3. Slow, meditative 3D rotation + gentle organic sway
                spinAngle += 0.21 * dt;
                const swayZ = Math.sin(t * 0.35) * 0.038;
                const swayX = 0.16 + Math.cos(t * 0.28) * 0.025;

                const cosY = Math.cos(spinAngle);
                const sinY = Math.sin(spinAngle);
                const cosX = Math.cos(swayX);
                const sinX = Math.sin(swayX);
                const cosZ = Math.cos(swayZ);
                const sinZ = Math.sin(swayZ);

                // Bounding-box-calibrated responsive scaling:
                // Fills ~90% of usable height and ~93% of usable width on BOTH mobile portrait and desktop without clipping
                const topPadRows = Math.ceil(safeTop / cellH) + 1.5;
                const bottomLimitRow = Math.max(topPadRows + 12, quoteTopRow - 1.2);
                const usableRows = bottomLimitRow - topPadRows;
                const sideSafeCols = Math.ceil(Math.max(safeLeft, safeRight) / cellW) + 1.5;
                const usableCols = Math.max(20, cols - sideSafeCols * 2);

                const cameraDist = 3.8;
                const frontPersp = cameraDist / Math.max(1.5, cameraDist - bounds.maxRadiusXZ * 0.92);
                const worldHeight = Math.max(1.5, bounds.maxY - bounds.minY);
                const worldMidY = (bounds.maxY + bounds.minY) * 0.5;

                // Desired scale in grid rows/cols to fill viewport generously without clipping
                const maxScaleYFromHeight = (usableRows * 0.93) / (worldHeight * frontPersp);
                const maxScaleXFromWidth = (usableCols * 0.94) / (bounds.maxRadiusXZ * 2.04 * frontPersp);
                const maxScaleYFromWidth = maxScaleXFromWidth * (cellW / cellH);

                // On tall mobile portrait screens, allow slight vertical elongation so the bouquet looks tall & grand
                const isPortrait = viewH > viewW * 1.15;
                const scaleY = isPortrait
                    ? Math.min(maxScaleYFromHeight, maxScaleYFromWidth * 1.38)
                    : Math.min(maxScaleYFromHeight, maxScaleYFromWidth);
                const scaleX = isPortrait
                    ? Math.min(maxScaleXFromWidth, scaleY * (cellH / cellW))
                    : scaleY * (cellH / cellW);

                const centerX = cols * 0.5;
                const centerY = topPadRows + usableRows * 0.5 + worldMidY * scaleY * 0.95;

                // Project and rasterize every 3D bouquet point into the ASCII grid
                for (let i = 0; i < bouquetPoints.length; i++) {
                    const pt = bouquetPoints[i];

                    const heightFactor = Math.max(0, (pt.y + 1.12) * 0.46);
                    const breezeX = Math.sin(t * 0.85 + pt.phase) * 0.008 * heightFactor;

                    // Smooth bloom unfold interpolation when switching flower modes
                    const unfold = 0.22 + 0.78 * bloomEase;
                    const px0 = (pt.x + breezeX) * unfold;
                    const py0 = -1.12 + (pt.y + 1.12) * (0.35 + 0.65 * bloomEase);
                    const pz0 = pt.z * unfold;

                    // Rotate around Y axis
                    const x1 = px0 * cosY - pz0 * sinY;
                    const z1 = px0 * sinY + pz0 * cosY;
                    const y1 = py0;

                    // Rotate around Z axis (gentle sway)
                    const x2 = x1 * cosZ - y1 * sinZ;
                    const y2 = x1 * sinZ + y1 * cosZ;
                    const z2 = z1;

                    // Tilt slightly toward camera (X axis)
                    const y3 = y2 * cosX - z2 * sinX;
                    const z3 = y2 * sinX + z2 * cosX;
                    const x3 = x2;

                    // Perspective projection
                    const denom = Math.max(0.6, cameraDist - z3);
                    const persp = cameraDist / denom;
                    const gx = Math.round(centerX + x3 * scaleX * persp);
                    const gy = Math.round(centerY - y3 * scaleY * persp);

                    const tangentVel = z1 * 0.48;

                    let ch = pt.customChar;
                    if (pt.type === 'stem') {
                        const slope = x3 / Math.max(0.25, y3 + 1.2);
                        if (slope < -0.38) ch = '\\';
                        else if (slope < -0.14) ch = '`';
                        else if (slope > 0.38) ch = '/';
                        else if (slope > 0.14) ch = ',';
                        else ch = (Math.abs(gx + gy) % 3 === 0) ? ':' : '|';
                    } else if (pt.type === 'wrap') {
                        ch = (gy % 2 === 0) ? '+' : '=';
                    }

                    plotCell(gx, gy, z3, ch, pt.color, pt.glow);

                    // Subtle horizontal ASCII scanline trails (-, =, .) on outer rotating blooms
                    if ((pt.type === 'petal' || pt.type === 'core') && Math.abs(tangentVel) > 0.22) {
                        const trailDir = tangentVel > 0 ? -1 : 1;
                        const trailCh = Math.abs(tangentVel) > 0.38 ? '=' : '-';
                        plotCell(gx + trailDir, gy, z3 - 0.04, trailCh, pt.color, 0.2);
                        if (Math.abs(tangentVel) > 0.42) {
                            plotCell(gx + trailDir * 2, gy, z3 - 0.08, '.', pt.color, 0);
                        }
                    }
                }

                // 4. Draw cached dark charcoal-slate vignette background and batched ASCII passes
                ctx.fillStyle = cachedBgGrad || '#181c24';
                ctx.fillRect(0, 0, viewW, viewH);

                ctx.font = `600 ${cellH}px "Courier New", Consolas, Monaco, monospace`;
                ctx.textBaseline = 'top';

                // Pass 1: Non-glowing characters (stems, foliage, background dots) with shadowBlur = 0
                ctx.shadowBlur = 0;
                let lastColor = '';
                for (let r = 0; r < rows; r++) {
                    const py = r * cellH;
                    const rowOffset = r * cols;
                    for (let c = 0; c < cols; c++) {
                        const idx = rowOffset + c;
                        const ch = charBuffer[idx];
                        if (!ch || glowBuffer[idx]) continue;

                        const col = colorBuffer[idx];
                        if (col !== lastColor) {
                            ctx.fillStyle = col;
                            lastColor = col;
                        }
                        ctx.fillText(ch, c * cellW, py);
                    }
                }

                // Pass 2: Glowing characters (blooms, cores, butterflies, quote)
                ctx.shadowBlur = cellH < 9 ? 5 : 7;
                lastColor = '';
                for (let r = 0; r < rows; r++) {
                    const py = r * cellH;
                    const rowOffset = r * cols;
                    for (let c = 0; c < cols; c++) {
                        const idx = rowOffset + c;
                        const ch = charBuffer[idx];
                        if (!ch || !glowBuffer[idx]) continue;

                        const col = colorBuffer[idx];
                        if (col !== lastColor) {
                            ctx.fillStyle = col;
                            ctx.shadowColor = col;
                            lastColor = col;
                        }
                        ctx.fillText(ch, c * cellW, py);
                    }
                }

                ctx.shadowBlur = 0;
                requestAnimationFrame(animate);
            }

            // Initialize geometry, listeners, and start animation
            buildBouquetGeometry(FLOWER_MODES[currentModeIndex]);
            resize();
            window.addEventListener('resize', resize);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', resize);
            }
            canvas.addEventListener('pointerdown', onPointerDown);
            canvas.addEventListener('pointerup', onPointerUp);
            canvas.addEventListener('pointercancel', onPointerCancel);
            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
